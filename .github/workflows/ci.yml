name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: npm install
      - run: python -m pip install -r skills/generate-talking-sprite-character/requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python skills/generate-talking-sprite-character/scripts/validate_character.py public/characters/pixel-bot/character.json
      - run: python skills/generate-talking-sprite-character/scripts/validate_character.py public/characters/pixel-portrait/character.json
