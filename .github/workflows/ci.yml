name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: npm ci
      - run: npm run setup:demo
      - run: python -m pip install -r skills/generate-talking-sprite-character/requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - run: python skills/generate-talking-sprite-character/scripts/validate_character.py public/characters/niu-lai/character.json
      - run: python skills/generate-talking-sprite-character/scripts/validate_character.py public/characters/pixel-bot/character.json
      - run: python skills/generate-talking-sprite-character/scripts/validate_character.py public/characters/pixel-portrait/character.json
