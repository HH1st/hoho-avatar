name: Publish SDK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run setup:demo
      - name: Match tag to package version
        run: node --input-type=module -e "import fs from 'node:fs'; if (process.env.GITHUB_REF_NAME !== 'v' + JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:package
      - name: Publish the tested tarball with trusted publishing
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish "./hh1st-hoho-avatar-${VERSION}.tgz" --provenance --access public --tag "$TAG"
